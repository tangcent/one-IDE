name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1). If provided, files will be updated and committed.'
        required: false
      target:
        description: 'Target to release (all, vscode, jetbrains)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - vscode
        - jetbrains

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Context
        id: ctx
        run: |
          # 1. Target
          TARGET="${{ github.event.inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          echo "target=$TARGET" >> $GITHUB_OUTPUT

          # 2. Version & Mode
          INPUT_VERSION="${{ github.event.inputs.version }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          if [ -n "$INPUT_VERSION" ]; then
             echo "Using manual input version: $INPUT_VERSION"
             echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
             echo "update_files=true" >> $GITHUB_OUTPUT
             echo "should_setup=true" >> $GITHUB_OUTPUT
             echo "should_release=false" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -iq "release"; then
             # Case insensitive check for 'release'
             # Extract version from package.json since we assume files are updated
             VERSION=$(grep '"version":' vscode-extension/package.json | head -n 1 | sed -E 's/.*"version": "(.*)",/\1/')
             echo "Detected release commit. Version from package.json: $VERSION"
             echo "version=$VERSION" >> $GITHUB_OUTPUT
             echo "update_files=false" >> $GITHUB_OUTPUT
             echo "should_setup=true" >> $GITHUB_OUTPUT
             echo "should_release=true" >> $GITHUB_OUTPUT
          else
             echo "No release trigger detected."
             echo "should_setup=false" >> $GITHUB_OUTPUT
             echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Set up JDK 17
        if: steps.ctx.outputs.should_setup == 'true'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build
        if: steps.ctx.outputs.should_release == 'true'
        run: |
          chmod +x script/build.sh
          ./script/build.sh ${{ steps.ctx.outputs.target }}

      - name: Generate Release Notes
        if: steps.ctx.outputs.should_release == 'true'
        id: notes
        run: |
          chmod +x script/release_note.sh
          # The script now outputs markdown notes to stdout
          ./script/release_note.sh ${{ steps.ctx.outputs.target }} > release_notes.md
          
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.ctx.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.ctx.outputs.version }}
          name: Release v${{ steps.ctx.outputs.version }}
          body: ${{ steps.notes.outputs.content }}
          files: |
            vscode-extension/*.vsix
            jetbrains-plugin/build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
